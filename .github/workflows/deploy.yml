name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight run finish rather than
# cancel it, so Pages never serves a half-deployed build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project page (the default for a repo that isn't named
          # <owner>.github.io) is served from /<repo-name>/, not "/".
          # eleventy.config.ts uses this to rewrite internal links and the
          # Vite asset base accordingly. Leave it unset if this repo is
          # served from a custom domain or as a user/org root page.
          PATH_PREFIX: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # First run on a repo that's never had Pages configured 404s
          # otherwise — this lets the action create the Pages site itself
          # using the pages: write permission already granted above, instead
          # of requiring the Settings → Pages → Source toggle to be flipped
          # by hand first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
